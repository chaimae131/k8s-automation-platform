# ======================================================
# FULL OBSERVABILITY STACK
# Prometheus + Loki + Promtail + Node Exporter + Grafana
# ======================================================

- name: Deploy Observability Stack
  hosts: master
  become: yes
  vars:
    kubeconfig: /etc/kubernetes/admin.conf

  tasks:

  # ----------------------------------------------------
  # 1. Namespace
  # ----------------------------------------------------
  - name: Create monitoring namespace
    kubernetes.core.k8s:
      api_version: v1
      kind: Namespace
      name: monitoring
      state: present
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  # ----------------------------------------------------
  # 2. Loki
  # ----------------------------------------------------
  - name: Loki ConfigMap
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: loki-config
          namespace: monitoring
        data:
          loki.yaml: |
            auth_enabled: false
            server:
              http_listen_port: 3100
            ingester:
              lifecycler:
                ring:
                  kvstore:
                    store: inmemory
                  replication_factor: 1
            schema_config:
              configs:
                - from: 2020-10-24
                  store: boltdb-shipper
                  object_store: filesystem
                  schema: v11
                  index:
                    prefix: index_
                    period: 24h
            storage_config:
              boltdb_shipper:
                active_index_directory: /data/index
                cache_location: /data/cache
                shared_store: filesystem
              filesystem:
                directory: /data/chunks
            compactor:
              working_directory: /wal

    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Loki Deployment
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: loki
          namespace: monitoring
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: loki
          template:
            metadata:
              labels:
                app: loki
            spec:
              initContainers:
                - name: init-loki-dirs
                  image: busybox
                  command: ["sh", "-c", "mkdir -p /data/index /data/cache /data/chunks /wal && chmod -R 777 /data /wal"]
                  volumeMounts:
                    - name: data
                      mountPath: /data
                    - name: wal
                      mountPath: /wal

              containers:
                - name: loki
                  image: grafana/loki:2.9.0
                  args:
                    - -config.file=/etc/loki/loki.yaml
                  ports:
                    - containerPort: 3100
                  volumeMounts:
                    - name: config
                      mountPath: /etc/loki
                    - name: data
                      mountPath: /data
                    - name: wal
                      mountPath: /wal
              volumes:
                - name: config
                  configMap:
                    name: loki-config
                - name: data
                  emptyDir: {}
                - name: wal
                  emptyDir: {}

    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Loki Service
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Service
        metadata:
          name: loki
          namespace: monitoring
        spec:
          type: ClusterIP
          selector:
            app: loki
          ports:
            - port: 3100
              targetPort: 3100
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

 # ----------------------------------------------------
  # 3. Promtail 
  # ----------------------------------------------------

  - name: Promtail ServiceAccount
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: promtail
          namespace: monitoring
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Promtail RBAC
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: promtail
        rules:
          - apiGroups: [""]
            resources: ["pods", "namespaces", "nodes"]
            verbs: ["get", "list", "watch"]
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Promtail RBAC Binding
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: promtail
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: promtail
        subjects:
          - kind: ServiceAccount
            name: promtail
            namespace: monitoring
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Promtail ConfigMap
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: promtail-config
          namespace: monitoring
        data:
          promtail.yaml: |
            server:
              http_listen_port: 9080
              grpc_listen_port: 0
              log_level: info

            positions:
              filename: /run/promtail/positions.yaml

            clients:
              - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
                timeout: 10s
                backoff_config:
                  min_period: 500ms
                  max_period: 5m
                  max_retries: 10

            scrape_configs:
              - job_name: kubernetes-pods
                kubernetes_sd_configs:
                  - role: pod
                
                pipeline_stages:
                  - cri: {}
                
                relabel_configs:
                  # Only scrape running pods
                  - source_labels:
                      - __meta_kubernetes_pod_phase
                    regex: Pending|Succeeded|Failed|Completed
                    action: drop
                  
                  # Drop init containers
                  - source_labels:
                      - __meta_kubernetes_pod_container_init
                    regex: true
                    action: drop
                  
                  # Add namespace label
                  - source_labels:
                      - __meta_kubernetes_namespace
                    target_label: namespace
                  
                  # Add pod name label
                  - source_labels:
                      - __meta_kubernetes_pod_name
                    target_label: pod
                  
                  # Add container name label
                  - source_labels:
                      - __meta_kubernetes_pod_container_name
                    target_label: container
                  
                  # Add node name label
                  - source_labels:
                      - __meta_kubernetes_pod_node_name
                    target_label: node
                  
                  # Add app label if exists
                  - source_labels:
                      - __meta_kubernetes_pod_label_app
                    target_label: app
                  
                  # FIXED: Construct the correct log file path
                  # Format: /var/log/pods/<namespace>_<pod-name>_<pod-uid>/<container-name>/*.log
                  - replacement: /var/log/pods/*$1/*.log
                    separator: /
                    source_labels:
                      - __meta_kubernetes_pod_uid
                      - __meta_kubernetes_pod_container_name
                    target_label: __path__

    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Promtail DaemonSet
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: promtail
          namespace: monitoring
        spec:
          selector:
            matchLabels:
              app: promtail
          updateStrategy:
            type: RollingUpdate
          template:
            metadata:
              labels:
                app: promtail
            spec:
              serviceAccountName: promtail
              tolerations:
                - effect: NoSchedule
                  operator: Exists
                - effect: NoExecute
                  operator: Exists
              
              containers:
                - name: promtail
                  image: grafana/promtail:2.9.0
                  imagePullPolicy: IfNotPresent
                  
                  args:
                    - -config.file=/etc/promtail/promtail.yaml
                  
                  env:
                    - name: HOSTNAME
                      valueFrom:
                        fieldRef:
                          fieldPath: spec.nodeName
                  
                  ports:
                    - name: http-metrics
                      containerPort: 9080
                      protocol: TCP
                  
                  # FIXED: Remove readOnlyRootFilesystem to allow positions file writing
                  securityContext:
                    runAsUser: 0
                    privileged: true
                  
                  readinessProbe:
                    httpGet:
                      path: /ready
                      port: http-metrics
                    initialDelaySeconds: 10
                    periodSeconds: 10
                    failureThreshold: 5
                  
                  volumeMounts:
                    - name: config
                      mountPath: /etc/promtail
                    - name: run
                      mountPath: /run/promtail
                    - name: containers
                      mountPath: /var/lib/docker/containers
                      readOnly: true
                    - name: pods
                      mountPath: /var/log/pods
                      readOnly: true
                  
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
              
              volumes:
                - name: config
                  configMap:
                    name: promtail-config
                - name: run
                  emptyDir: {}
                - name: containers
                  hostPath:
                    path: /var/lib/docker/containers
                - name: pods
                  hostPath:
                    path: /var/log/pods

    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  # ----------------------------------------------------
  # 4. Node Exporter
  # ----------------------------------------------------
  - name: Node Exporter DaemonSet
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: node-exporter
          namespace: monitoring
        spec:
          selector:
            matchLabels:
              app: node-exporter
          template:
            metadata:
              labels:
                app: node-exporter
            spec:
              # ADD THIS BLOCK TO RUN ON MASTER
              tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                - key: node-role.kubernetes.io/master
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: node-exporter
                  image: prom/node-exporter
                  ports:
                    - containerPort: 9100
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  # ----------------------------------------------------
  # 5. Prometheus
  # ----------------------------------------------------
  
  - name: Prometheus ServiceAccount
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: prometheus
          namespace: monitoring
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Prometheus ClusterRole
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: prometheus
        rules:
          - apiGroups: [""]
            resources:
              - nodes
              - nodes/proxy
              - nodes/metrics
              - services
              - endpoints
              - pods
            verbs: ["get", "list", "watch"]
          - apiGroups:
              - extensions
              - networking.k8s.io
            resources:
              - ingresses
            verbs: ["get", "list", "watch"]
          - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
            verbs: ["get"]
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Prometheus ClusterRoleBinding
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: prometheus
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: prometheus
        subjects:
          - kind: ServiceAccount
            name: prometheus
            namespace: monitoring
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Prometheus ConfigMap
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: prometheus-config
          namespace: monitoring
        data:
          prometheus.yml: |
            global:
              scrape_interval: 15s
              evaluation_interval: 15s
              external_labels:
                cluster: 'kubernetes-cluster'
            
            scrape_configs:
              # Scrape Node Exporter
              - job_name: 'node-exporter'
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names:
                        - monitoring
                
                relabel_configs:
                  # Only keep pods with app=node-exporter label
                  - source_labels: [__meta_kubernetes_pod_label_app]
                    action: keep
                    regex: node-exporter
                  
                  # Add node name as a label
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                  
                  # Add pod name as a label
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  
                  # Add namespace as a label
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
              
              # Scrape Prometheus itself
              - job_name: 'prometheus'
                static_configs:
                  - targets: ['localhost:9090']
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Prometheus Deployment
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: prometheus
          namespace: monitoring
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: prometheus
          template:
            metadata:
              labels:
                app: prometheus
            spec:
              serviceAccountName: prometheus  # THIS IS THE KEY FIX
              containers:
                - name: prometheus
                  image: prom/prometheus:latest
                  args:
                    - '--config.file=/etc/prometheus/prometheus.yml'
                    - '--storage.tsdb.path=/prometheus'
                    - '--storage.tsdb.retention.time=15d'
                    - '--web.enable-lifecycle'
                  ports:
                    - name: web
                      containerPort: 9090
                  volumeMounts:
                    - name: config
                      mountPath: /etc/prometheus
                    - name: storage
                      mountPath: /prometheus
                  resources:
                    requests:
                      cpu: 200m
                      memory: 512Mi
                    limits:
                      cpu: 500m
                      memory: 1Gi
              volumes:
                - name: config
                  configMap:
                    name: prometheus-config
                - name: storage
                  emptyDir: {}
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Prometheus Service
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Service
        metadata:
          name: prometheus
          namespace: monitoring
        spec:
          type: ClusterIP
          selector:
            app: prometheus
          ports:
            - name: web
              port: 9090
              targetPort: 9090
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  # ----------------------------------------------------
  # 6. Grafana
  # ----------------------------------------------------
  - name: Grafana Datasources
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: grafana-datasources
          namespace: monitoring
        data:
          datasources.yaml: |
            apiVersion: 1
            datasources:
              - name: Loki
                type: loki
                access: proxy
                url: http://loki:3100
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus:9090
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Grafana Deployment
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: grafana
          namespace: monitoring
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: grafana
          template:
            metadata:
              labels:
                app: grafana
            spec:
              containers:
                - name: grafana
                  image: grafana/grafana
                  env:
                    - name: GF_SECURITY_ADMIN_PASSWORD
                      value: admin
                  ports:
                    - containerPort: 3000
                  volumeMounts:
                    - name: datasources
                      mountPath: /etc/grafana/provisioning/datasources
              volumes:
                - name: datasources
                  configMap:
                    name: grafana-datasources
    environment:
      KUBECONFIG: "{{ kubeconfig }}"

  - name: Grafana Service (NodePort)
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Service
        metadata:
          name: grafana
          namespace: monitoring
        spec:
          type: NodePort
          selector:
            app: grafana
          ports:
            - port: 3000
              targetPort: 3000
              nodePort: 32000
    environment:
      KUBECONFIG: "{{ kubeconfig }}"
  
  - name: Deploy Node Exporter
    kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: node-exporter
          namespace: monitoring
          labels:
            app: node-exporter
        spec:
          selector:
            matchLabels:
              app: node-exporter
          template:
            metadata:
              labels:
                app: node-exporter
            spec:
              containers:
              - name: node-exporter
                image: prom/node-exporter
                ports:
                - containerPort: 9100
    environment:
      KUBECONFIG: "{{ kubeconfig }}"
