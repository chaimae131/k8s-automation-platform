---
#=======================================================
# STEP 1: Install Container Runtime (containerd)
#=======================================================
- name: Install and configure containerd
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Install dependencies
      apt:
        name:
          - curl
          - apt-transport-https
          - ca-certificates
          - software-properties-common
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Install containerd
      apt:
        name: containerd
        state: present
        update_cache: yes

    - name: Generate default containerd configuration
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable SystemdCgroup in containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes

#=======================================================
# STEP 2: Configure System Prerequisites & Security Hardening
#=======================================================
- name: Configure system for Kubernetes with security hardening
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Add entries to /etc/hosts for all nodes
      lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host }} {{ item }}"
        state: present
      loop: "{{ groups['k8s_cluster'] }}"

    - name: Disable Swap
      command: swapoff -a

    - name: Keep swap disabled after reboot
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Load required kernel modules
      copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/k8s.conf

    - name: Load modules immediately
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure sysctl for Kubernetes
      copy:
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        dest: /etc/sysctl.d/k8s.conf

    - name: Apply sysctl settings
      command: sysctl --system

#=======================================================
# STEP 3: Install Kubernetes Components
#=======================================================
- name: Install Kubernetes packages
  hosts: k8s_cluster
  become: yes
  tasks:
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes GPG key
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
        state: present
        keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
        state: present
        filename: kubernetes

    - name: Install Kubernetes packages
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: yes
        state: started

#=======================================================
# STEP 4: Initialize Kubernetes Master (Control Plane)
#=======================================================
- name: Initialize Kubernetes Control Plane
  hosts: masters
  become: yes
  tasks:
    - name: Check if Kubernetes is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_init_stat

    - name: Initialize Kubernetes cluster
      command: kubeadm init --pod-network-cidr=10.244.0.0/16 --apiserver-advertise-address={{ ansible_host }}
      register: kubeadm_output
      when: not k8s_init_stat.stat.exists
      failed_when: kubeadm_output.rc != 0

    - name: Display kubeadm init output
      debug:
        msg: "{{ kubeadm_output.stdout_lines }}"
      when: not k8s_init_stat.stat.exists and kubeadm_output is defined

    - name: Check if k8s user exists
      shell: id k8s
      register: k8s_user_check
      failed_when: false
      changed_when: false

    - name: Create .kube directory for k8s user
      file:
        path: /home/k8s/.kube
        state: directory
        owner: k8s
        group: k8s
        mode: '0755'
      when: k8s_user_check.rc == 0

    - name: Copy admin.conf to k8s user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/k8s/.kube/config
        owner: k8s
        group: k8s
        mode: '0644'
        remote_src: yes
      when: k8s_user_check.rc == 0

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy admin.conf to root's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        owner: root
        group: root
        mode: '0644'
        remote_src: yes

    - name: Wait for kube-apiserver to be ready
      wait_for:
        host: "{{ ansible_host }}"
        port: 6443
        delay: 10
        timeout: 300

    - name: Install Flannel CNI plugin
      command: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      when: not k8s_init_stat.stat.exists
      retries: 3
      delay: 10
      register: flannel_result
      until: flannel_result.rc == 0

    - name: Wait for Flannel pods to be ready
      shell: kubectl get pods -n kube-flannel --no-headers | grep -v Running | wc -l
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_pods
      until: flannel_pods.stdout == "0"
      retries: 20
      delay: 10
      ignore_errors: yes

    - name: Generate join command with 24h TTL
      command: kubeadm token create --print-join-command --ttl 24h
      register: join_command

    - name: Save join command to file
      copy:
        content: "{{ join_command.stdout }}"
        dest: /tmp/k8s_join_command.sh
        mode: '0755'

    - name: Display join command
      debug:
        msg: "{{ join_command.stdout }}"

#=======================================================
# STEP 5: Join Worker Nodes to Cluster
#=======================================================
- name: Join worker nodes to cluster
  hosts: workers
  become: yes
  tasks:
    - name: Check if node is already in cluster
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Reset kubeadm if ca.crt exists but node not in cluster
      command: kubeadm reset -f
      when: not kubelet_conf.stat.exists
      ignore_errors: yes

    - name: Clean up old Kubernetes files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes/
        - /var/lib/kubelet/
        - /var/lib/etcd/
      when: not kubelet_conf.stat.exists
      ignore_errors: yes

    - name: Copy join command from master
      slurp:
        src: /tmp/k8s_join_command.sh
      register: join_command_content
      delegate_to: "{{ groups['masters'][0] }}"
      when: not kubelet_conf.stat.exists

    - name: Join worker to cluster
      shell: "{{ join_command_content.content | b64decode }} --node-name {{ inventory_hostname }}"
      when: not kubelet_conf.stat.exists
      register: join_result
      failed_when: join_result.rc != 0

    - name: Display join result
      debug:
        msg: "{{ join_result.stdout_lines }}"
      when: not kubelet_conf.stat.exists and join_result is defined

    - name: Wait for kubelet to start
      systemd:
        name: kubelet
        state: started
      when: not kubelet_conf.stat.exists

#=======================================================
# STEP 6: Verify Cluster Status
#=======================================================
- name: Verify cluster setup
  hosts: masters
  become: yes
  tasks:
    - name: Wait for all nodes to be ready
      shell: kubectl get nodes --no-headers | awk '{print $2}' | grep -v "^Ready$" | wc -l
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: not_ready_nodes
      until: not_ready_nodes.stdout == "0"
      retries: 30
      delay: 10

    - name: Get cluster nodes
      command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_nodes

    - name: Display cluster nodes
      debug:
        msg: "{{ cluster_nodes.stdout_lines }}"

    - name: Get system pods status
      command: kubectl get pods --all-namespaces
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: all_pods

    - name: Display all pods
      debug:
        msg: "{{ all_pods.stdout_lines }}"

    - name: Check if test deployment exists
      shell: kubectl get deployment nginx 2>/dev/null
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: nginx_exists
      failed_when: false
      changed_when: false

    - name: Get services
      command: kubectl get svc
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: services

    - name: Display services
      debug:
        msg: "{{ services.stdout_lines }}"

    - name: Get cluster info
      command: kubectl cluster-info
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cluster_info

    - name: Display cluster info
      debug:
        msg: "{{ cluster_info.stdout_lines }}"

    - name: Final cluster status
      debug:
        msg:
          - "=== Kubernetes Cluster Setup Complete ==="
          - "Nodes: {{ cluster_nodes.stdout_lines | length - 1 }}"
          - "All nodes are Ready"
          - "Test nginx deployment created successfully"

